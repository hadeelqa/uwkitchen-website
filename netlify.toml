# netlify.toml - mirrors firebase.json hosting config
# Last redeploy: 2026-04-16 (post DNS cleanup)

[build]
  publish = "public"

# Pretty URLs (cleanUrls)
[build.processing]
  skip_processing = false

# ─── CLOUDINARY IMAGE CDN ─────────────────────────
# Auto-rewrites <img> tags so images are served from Cloudinary's global CDN
# instead of Netlify, cutting bandwidth use and serving modern formats (WebP/AVIF).
# Uses Cloudinary "fetch" mode — no upload needed, no API keys required.
[[plugins]]
  package = "netlify-plugin-cloudinary"

  [plugins.inputs]
  cloudName = "dbj4aba8i"
  deliveryType = "fetch"

# ─── REDIRECTS (301) ─────────────────────────────
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ar/maintenance-request"
  to = "/support"
  status = 301
  force = true

[[redirects]]
  from = "/ar/maintenance-request/"
  to = "/support"
  status = 301
  force = true

[[redirects]]
  from = "/maintenance-request"
  to = "/support"
  status = 301
  force = true

# ─── REWRITES (200 = serve different file) ──────
[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/maintenance-request.html"
  status = 200

[[redirects]]
  from = "/support/"
  to = "/maintenance-request.html"
  status = 200

# ─── CACHE HEADERS ──────────────────────────────
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "text/plain; charset=utf-8"
